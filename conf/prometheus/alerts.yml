groups:
  - name: fastauth
    rules:
      - alert: FastauthHighErrorRate
        expr: |
          rate(fastauth_http_requests_total{status_code=~"5.."}[5m])
          /
          rate(fastauth_http_requests_total[5m]) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate ({{ $value | humanizePercentage }})"
          description: "More than 1% of requests are returning 5xx errors over the last 5 minutes."

      - alert: FastauthHighLatency
        expr: |
          histogram_quantile(
            0.99,
            rate(fastauth_http_request_duration_seconds_bucket[5m])
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p99 latency above 2s ({{ $value | humanizeDuration }})"
          description: "The 99th percentile request latency has exceeded 2 seconds for 5 minutes."
