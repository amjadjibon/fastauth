version: 1
disable_existing_loggers: false

filters:
  request_context:
    (): app.core.log_context.RequestContextFilter

formatters:
  json:
    (): pythonjsonlogger.json.JsonFormatter
    fmt: "%(asctime)s %(levelname)s %(name)s %(message)s %(request_id)s %(trace_id)s %(method)s %(path)s %(status_code)s %(duration_ms)s %(client_ip)s %(user_agent)s %(content_length)s"
    datefmt: "%Y-%m-%dT%H:%M:%SZ"
    rename_fields:
      asctime: timestamp
      levelname: level
      name: logger

handlers:
  console:
    class: logging.StreamHandler
    formatter: json
    filters: [request_context]
    stream: ext://sys.stdout

loggers:
  fastauth:
    level: DEBUG
    handlers: [console]
    propagate: false

  uvicorn:
    level: INFO
    handlers: [console]
    propagate: false

  uvicorn.access:
    level: WARNING
    handlers: [console]
    propagate: false

  sqlalchemy.engine:
    level: WARNING
    handlers: [console]
    propagate: false

  alembic:
    level: INFO
    handlers: [console]
    propagate: false

root:
  level: WARNING
  handlers: [console]
