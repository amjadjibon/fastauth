<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}FastAuth{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f11;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #1a1a1f;
      border: 1px solid #2a2a35;
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 420px;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #fff;
      margin-bottom: 0.25rem;
    }

    .logo span { color: #7c6af7; }

    .subtitle {
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 1.75rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 0.4rem;
    }

    input {
      width: 100%;
      background: #0f0f11;
      border: 1px solid #2a2a35;
      border-radius: 8px;
      padding: 0.65rem 0.85rem;
      color: #e2e8f0;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 1rem;
    }

    input:focus { border-color: #7c6af7; }

    button[type="submit"] {
      width: 100%;
      background: #7c6af7;
      border: none;
      border-radius: 8px;
      padding: 0.7rem;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 0.25rem;
    }

    button[type="submit"]:hover { background: #6a58e0; }
    button[type="submit"]:disabled { background: #3a3a4a; cursor: not-allowed; }

    .link-row {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.82rem;
      color: #64748b;
    }

    .link-row a { color: #7c6af7; text-decoration: none; }
    .link-row a:hover { text-decoration: underline; }

    .error {
      background: #2d1515;
      border: 1px solid #7f1d1d;
      color: #fca5a5;
      border-radius: 8px;
      padding: 0.6rem 0.85rem;
      font-size: 0.82rem;
      margin-bottom: 1rem;
      display: none;
    }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
